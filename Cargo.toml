[workspace]
resolver = "2"
members = ["native/learning", "native/app"]

# Groiz is a standalone repository: the Zio checkout it builds against sits
# in the sibling directory `../zio` (the path dependencies in
# `native/*/Cargo.toml` name it explicitly), and its Zio sources, libraries
# and toolchain come from there. Clone both side by side or the workspace
# will not resolve.
[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lszio/groiz"
homepage = "https://github.com/lszio/zio"
authors = ["lszio"]
